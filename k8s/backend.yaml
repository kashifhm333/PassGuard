apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: passguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: kashifhm333/passguard-backend:v1
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/PassGuard"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: passguard
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300